[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard-ai"
version = "1.0.0"
description = "Institutional Compliance & Regulatory Audit Pipeline for Investment Instruments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Nguyen Nhat Nam", email = "compliance-lead@finguard.ai" }
]
keywords = [
    "fintech",
    "compliance",
    "regulatory-audit",
    "sec-howey",
    "anti-fraud",
    "contract-analysis",
    "hyip-detection",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "streamlit>=1.35.0,<2.0.0",
    "plotly>=5.22.0,<6.0.0",
    "pypdf>=4.2.0,<5.0.0",
    "reportlab>=4.1.0,<5.0.0",
    "python-multipart>=0.0.9,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/nnn14092004-cyber/finguard-ai"
Repository = "https://github.com/nnn14092004-cyber/finguard-ai.git"
Documentation = "https://github.com/nnn14092004-cyber/finguard-ai#readme"
Tracker = "https://github.com/nnn14092004-cyber/finguard-ai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# Pytest execution configuration
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --tb=short --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*:",
    "ignore::DeprecationWarning:anyio.*:",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

# Code coverage thresholds and exclusions
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "src/ui/*",
    "src/domain/exceptions.py",
    "src/domain/value_objects.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# Ruff linter and code style rules
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "C4",
]
ignore = [
    "E501",
    "B008",
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"src/ui/*" = ["E402", "C408"]
"tests/*" = ["W291", "W293"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# Mypy static type analysis
[tool.mypy]
python_version = "3.12"
mypy_path = "."
packages = ["src"]
explicit_package_bases = true
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "plotly.*",
    "reportlab.*",
    "pypdf.*",
]
ignore_missing_imports = true