[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard-ai"
version = "1.0.0"
description = "Institutional Compliance & Regulatory Audit Pipeline for Investment Instruments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Nguyen Nhat Nam", email = "compliance-lead@finguard.ai" }
]
keywords = [
    "fintech",
    "compliance",
    "regulatory-audit",
    "sec-howey",
    "anti-fraud",
    "contract-analysis",
    "hyip-detection",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "streamlit>=1.35.0,<2.0.0",
    "plotly>=5.22.0,<6.0.0",
    "pypdf>=4.2.0,<5.0.0",
    "reportlab>=4.1.0,<5.0.0",
    "python-multipart>=0.0.9,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/nnn14092004-cyber/finguard-ai"
Repository = "https://github.com/nnn14092004-cyber/finguard-ai.git"
Documentation = "https://github.com/nnn14092004-cyber/finguard-ai#readme"
Tracker = "https://github.com/nnn14092004-cyber/finguard-ai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ==============================================================================
# PYTEST TEST HARNESS & INI OPTIONS
# ==============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --tb=short --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*:",
    "ignore::DeprecationWarning:anyio.*:",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

# ==============================================================================
# CODE COVERAGE INSTRUMENTATION
# ==============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "src/ui/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ==============================================================================
# RUFF: HIGH-PERFORMANCE PYTHON LINTER & FORMATTER
# ==============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # Line length handled by formatter
    "B008",  # Do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ==============================================================================
# MYPY: STATIC TYPE CHECKER CONFIGURATION
# ==============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "plotly.*",
    "reportlab.*",
    "pypdf.*",
]
ignore_missing_imports = true