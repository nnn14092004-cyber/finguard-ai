name: FinGuard Institutional Compliance CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regulatory-audit-test:
    name: Run Statutory Compliance Audit Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade core build tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies and testing harnesses
        run: |
          pip install -e ".[dev]"
          pip install pypdf reportlab

      - name: Execute Pytest verification suite
        run: |
          pytest -v --tb=short --cov=src --cov-report=term-missing tests/