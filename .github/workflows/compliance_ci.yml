name: FinGuard-AI Enterprise Compliance & Performance CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Code Hygiene & Type Safety
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Toolchain Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt

      - name: Run Ruff Code Inspection
        run: |
          ruff check src tests scripts

      - name: Run Ruff Format Verification
        run: |
          ruff format --check src tests scripts

      - name: Run Mypy Strict Static Type Verification
        run: |
          mypy src

  test:
    name: Statutory Verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Runtime & Testing Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Execute Deterministic Statutory Test Suite (29/29 Tests)
        run: |
          pytest -v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=80 tests/

  benchmark-sla:
    name: Adversarial Evaluation & Sub-Second Latency SLA Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Execution Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Step 1 - Synthesize 100 Adversarial Benchmark Contracts
        run: |
          python scripts/generate_adversarial_dataset.py

      - name: Step 2 - Execute Adversarial Stress-Test Benchmark
        run: |
          python scripts/run_benchmark.py

      - name: Step 3 - Execute Sub-Second Latency & Throughput SLA Profile (1,000 Audits)
        run: |
          python scripts/benchmark_subsecond.py