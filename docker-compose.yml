networks:
  finguard-network:
    driver: bridge
    name: finguard-network

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finguard-api-gateway
    restart: unless-stopped
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - finguard-network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finguard-executive-cockpit
    restart: unless-stopped
    command: [
      "streamlit", "run", "src/ui/dashboard.py",
      "--server.port=8501",
      "--server.address=0.0.0.0",
      "--server.headless=true",
      "--browser.gatherUsageStats=false"
    ]
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - finguard-network